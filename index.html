<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Theatre Voice Tracks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rehearsal Tracks</h1>
        
        <div class="controls">
            <div class="form-group">
                <label for="song-select">Song:</label>
                <select id="song-select"></select>
            </div>

            <div class="form-group">
                <label for="section-select">Section:</label>
                <select id="section-select"></select>
            </div>

            <div class="form-group">
                <label for="voice-select">Voice:</label>
                <select id="voice-select"></select>
            </div>
        </div>

        <div class="player-section">
            <iframe id="audio-player" width="100%" height="200" frameborder="0" allow="autoplay; encrypted-media" title="Audio track preview"></iframe>
            <p id="audio-status" class="audio-status" hidden>No audio is available for this selection.</p>
        </div>

        <div class="info-section">
            <h3>Who is singing this part?</h3>
            <p id="singer-info">Select a track to see the cast.</p>
        </div>

        <div class="video-section" id="video-section">
            <h3>Video reference</h3>
            <div class="video-wrapper">
                <iframe id="youtube-player" width="100%" height="315" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="Song video reference"></iframe>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
