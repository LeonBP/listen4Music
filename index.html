<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voces 4Music Teatral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="resources/logo.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="resources/logo.jpg">
</head>
<body>
    <div class="container">
        <h1>El Jorobado de Notre Dame</h1>
        
        <div class="controls">
            <div class="form-group">
                <label for="song-select">Canción:</label>
                <select id="song-select"></select>
            </div>

            <div class="form-group">
                <label for="section-select">Sección:</label>
                <select id="section-select"></select>
            </div>

            <div class="form-group">
                <label for="voice-select">Voz:</label>
                <select id="voice-select"></select>
            </div>
        </div>

        <div class="player-section">
            <iframe id="audio-player" width="100%" height="200" frameborder="0" allow="autoplay; encrypted-media" title="Vista previa de pista de audio"></iframe>
            <p id="audio-status" class="audio-status" hidden>No hay audio disponible para esta selección.</p>
        </div>

        <div class="info-section">
            <h3>¿Quién canta esta parte?</h3>
            <p id="singer-info">Selecciona una pista para ver el reparto.</p>
        </div>

        <div class="video-section" id="video-section">
            <h3>Canción original completa</h3>
            <div class="video-wrapper">
                <iframe id="youtube-player" width="100%" height="315" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="Video de referencia de la canción"></iframe>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
